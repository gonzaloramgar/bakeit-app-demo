<div class="menu-container">
  <button class="back-btn" routerLink="/">⬅ Volver al Inicio</button>
  
  <div class="search-container">
    <input type="text" class="search-bar" placeholder="Buscar bollos, tartas...">
  </div>

  <div class="filters">
    <button *ngFor="let filtro of filtros" 
            class="filter-btn"
            [class.active]="filtro === filtroActivo"
            (click)="setFiltro(filtro)">
      {{ filtro }}
    </button>
  </div>

  <div class="product-grid">
    <div class="product-card" *ngFor="let producto of productos">
    <div class="product-image">
      <img [src]="producto.imagen" [alt]="producto.nombre">
    </div>
      <h3>{{ producto.nombre }}</h3>
      <p class="nutricion">Kcal: {{ producto.kcal }} | Prot: {{ producto.proteina }} | Carb: {{ producto.carbohidratos }}</p>
      <p class="alergenos">
        <span *ngIf="producto.gluten" class="con-gluten">Contiene Gluten</span>
        <span *ngIf="!producto.gluten" class="sin-gluten">Sin Gluten (Apto Celiacos)</span>
      </p>
    </div>
  </div>
</div>
